# Keep the tested 48 kHz speaker route and fixed amplifier protection gain.
# Microphone routing has not been adapted and is not exposed as a working input.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-mocha-audio-runtime" } ]
    actions = {
      update-props = {
        device.description = "Mocha 内置扬声器"
        device.profile-set = "mocha-speakers.conf"
        api.alsa.use-ucm = false
        api.alsa.soft-mixer = true
        api.acp.probe-rate = 48000
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-mocha-audio-runtime.*" } ]
    actions = {
      update-props = {
        node.description = "Mocha 内置扬声器"
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        session.suspend-timeout-seconds = 3
      }
    }
  }
]
